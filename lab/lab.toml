[lab]
realm = "LAB.INTERNAL"
domain = "lab.internal"
overlay = "10.255.0.0/16"

[dns]
serial = 2026112701
ttl = 3600
refresh = 3600
retry = 600
expire = 604800
minimum = 300

  # The identity node does not exist yet, so the delegation carries its glue.
  [[dns.delegate]]
  name = "ipa"
  ns = "ipa.lab.internal."
  address = "10.100.10.53"

[[site]]
id = "branch"
prefix = "10.200.0.0/16"

  [[site.segment]]
  name = "lan"
  cidr = "10.200.10.0/24"
  pool = "10.200.10.100 - 10.200.10.199"

[[site]]
id = "dc"
prefix = "10.100.0.0/16"

  [[site.segment]]
  name = "mgmt"
  cidr = "10.100.10.0/24"

  [[site.segment]]
  name = "data"
  cidr = "10.100.20.0/24"

[[scenario]]
id = "s2-dhcp"
title = "relayed DHCP with a surviving lease"
vm_budget = 3
ram_budget_mib = 3072

[[node]]
scenario = "s2-dhcp"
name = "dhcp-a"
site = "dc"
role = "dhcp"
profile = "server"
vcpus = 1
ram_mib = 1024
disk_gib = 8

  [[node.interface]]
  segment = "mgmt"
  address = "10.100.10.21"
  gateway = "10.100.10.1"
  nameservers = ["10.100.10.11"]
  routes = [{ to = "10.200.10.0/24", via = "10.100.10.22" }]

[[node]]
scenario = "s2-dhcp"
name = "relay-a"
site = "dc"
role = "dhcp"
profile = "relay"
vcpus = 1
ram_mib = 1024
disk_gib = 8

  [[node.interface]]
  segment = "mgmt"
  address = "10.100.10.22"
  gateway = "10.100.10.1"
  nameservers = ["10.100.10.11"]

  [[node.interface]]
  segment = "lan"
  address = "10.200.10.254"

[[node]]
scenario = "s2-dhcp"
name = "client-a"
site = "dc"
role = "client"
vcpus = 1
ram_mib = 1024
disk_gib = 8

  [[node.interface]]
  segment = "mgmt"
  address = "10.100.10.23"
  gateway = "10.100.10.1"
  nameservers = ["10.100.10.11"]

  [[node.interface]]
  segment = "lan"
  mode = "dhcp"

[[scenario]]
id = "s0-base"
title = "bootable image"
vm_budget = 1
ram_budget_mib = 2048

[[node]]
scenario = "s0-base"
name = "base-a"
site = "dc"
role = "dns"
vcpus = 1
ram_mib = 1024
disk_gib = 8

  [[node.interface]]
  segment = "mgmt"
  address = "10.100.10.20"
  gateway = "10.100.10.1"
  nameservers = ["10.100.10.20"]

[[scenario]]
id = "s1-dns"
title = "authoritative plus recursive"
vm_budget = 2
ram_budget_mib = 3072

[[node]]
scenario = "s1-dns"
name = "dns-a"
site = "dc"
role = "dns"
vcpus = 1
ram_mib = 1024
disk_gib = 8

  [[node.interface]]
  segment = "mgmt"
  address = "10.100.10.11"
  gateway = "10.100.10.1"
  nameservers = ["10.100.10.11"]

  [[node.interface]]
  segment = "data"
  address = "10.100.20.11"
  gateway = "10.100.20.1"
  nameservers = ["10.100.10.11"]

[[node]]
scenario = "s1-dns"
name = "dns-b"
site = "dc"
role = "dns"
secondary = "dns-a"
vcpus = 1
ram_mib = 1024
disk_gib = 8

  [[node.interface]]
  segment = "mgmt"
  address = "10.100.10.12"
  gateway = "10.100.10.1"
  nameservers = ["10.100.10.11"]
