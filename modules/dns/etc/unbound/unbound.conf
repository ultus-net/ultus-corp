server:
    # The package is built with /etc/unbound as its default chroot, and the unit
    # is Type=notify. Inside that chroot the daemon cannot see
    # /run/systemd/notify, so it exits at startup with a fatal sd_notify error
    # while unbound-checkconf still calls the file valid.
    chroot: ""
    interface: 127.0.0.1
    port: 53
    do-not-query-localhost: no
    access-control: 127.0.0.0/8 allow
    access-control: 10.0.0.0/8 allow
    verbosity: 1

forward-zone:
    name: "lab.internal"
    forward-addr: 127.0.0.2
