options {
    directory "/var/named";
    listen-on port 53 { 127.0.0.2; };
    listen-on-v6 { none; };
    recursion no;
    allow-query { any; };
    allow-transfer { none; };
    dnssec-validation no;
};

# BEGIN ultus-zone
zone "lab.internal" {
    type primary;
    file "lab.internal.zone";
    allow-update { none; };
};
# END ultus-zone
